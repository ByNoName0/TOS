# ==============================================================================
# TOS 0.1 Alpha — Picom Compositor Configuration
# High performance, zero GPU lag, subtle shadows, rounded corners.
# ==============================================================================

# Backend
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
vsync = true;

# Subtle Shadows (Dark Black #05070A)
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.65;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Window Corner Rounding
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Fading
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 4;

# Window Transparency
active-opacity = 1.0;
inactive-opacity = 0.98;
frame-opacity = 1.0;
