# ==============================================================================
# TOS 0.1 Alpha — PCManFM Lightweight File Manager Configuration
# Low memory footprint (~18 MB RAM), fast file search, dark theme.
# ==============================================================================
[config]
bm_open_method=0

[volume]
mount_on_startup=1
mount_removable=1
autorun=0

[ui]
always_show_tabs=0
max_tab_chars=32
win_width=860
win_height=520
splitter_pos=180
media_in_new_tab=0
desktop_folder_new_win=0
change_win_title=1
side_pane_mode=places
view_mode=icon
show_hidden=0
sort_type=0
sort_by=2
common_bg=#05070A
common_fg=#EAF4FF
