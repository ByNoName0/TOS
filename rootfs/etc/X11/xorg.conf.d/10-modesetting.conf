# ==============================================================================
# TOS 0.1 Alpha — Modern KMS & Glamor Acceleration Configuration
# Uses kernel modesetting driver by default for Intel, AMD, and Nouveau GPUs.
# ==============================================================================
Section "Device"
    Identifier  "TOS Graphics Device"
    Driver      "modesetting"
    Option      "AccelMethod"    "glamor"
    Option      "DRI"            "3"
    Option      "TearFree"       "true"
EndSection
