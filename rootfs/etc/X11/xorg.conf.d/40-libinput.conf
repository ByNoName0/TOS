# ==============================================================================
# TOS 0.1 Alpha — Touchpad & Mouse Configuration (libinput)
# Enables tap-to-click and responsive pointer acceleration for laptops.
# ==============================================================================
Section "InputClass"
    Identifier "TOS Touchpad Default"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "true"
    Option "ClickMethod" "buttonareas"
    Option "DisableWhileTyping" "true"
EndSection

Section "InputClass"
    Identifier "TOS Mouse Default"
    MatchIsPointer "on"
    Driver "libinput"
    Option "AccelSpeed" "0.0"
EndSection
