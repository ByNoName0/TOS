# ==============================================================================
# TOS 0.1 Alpha — Master Bootloader Configuration (UEFI & BIOS Dual Mode)
# Designed for hybrid ISOs, USB flash drives, and direct drive installations.
# ==============================================================================

set default="0"
set timeout=8

# Terminal and visual theme styling
insmod all_video
insmod font
insmod gfxterm
insmod png

# TOS Visual Theme Colors: #05070A (Deep Black), #1683FF (Electric Blue), #EAF4FF (Text)
set menu_color_normal=white/black
set menu_color_highlight=cyan/black
set color_normal=light-gray/black
set color_highlight=cyan/black

if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=1024x768,auto
    terminal_output gfxterm
fi

# ==============================================================================
# TOS BOOT ENTRIES
# ==============================================================================

menuentry "Try TOS 0.1 Alpha (Live Desktop - Run entirely from RAM)" --class tos --class gnu-linux --class os {
    echo "        TOS"
    echo ""
    echo "     Starting..."
    linux  /live/vmlinuz boot=live components quiet splash findiso=${iso_path}
    initrd /live/initrd.img
}

menuentry "Install TOS 0.1 Alpha (Direct Guided Disk Installer)" --class installer --class os {
    echo "        TOS"
    echo ""
    echo "     Starting Installer..."
    linux  /live/vmlinuz boot=live components quiet splash tos-mode=installer findiso=${iso_path}
    initrd /live/initrd.img
}

menuentry "TOS Recovery Console (Single-User / Maintenance Shell)" --class recovery --class os {
    echo "        TOS"
    echo ""
    echo "     Starting Recovery Mode..."
    linux  /live/vmlinuz boot=live components single systemd.unit=rescue.target
    initrd /live/initrd.img
}

menuentry "TOS Safe Graphics Mode (Nomodeset Fallback)" --class fallback --class os {
    echo "        TOS"
    echo ""
    echo "     Starting in Safe Graphics Mode..."
    linux  /live/vmlinuz boot=live components nomodeset xforcevesa
    initrd /live/initrd.img
}

menuentry "TOS Toram Mode (Copy Entire OS into RAM for Max Speed)" --class toram --class os {
    echo "        TOS"
    echo ""
    echo "     Copying TOS system into RAM..."
    linux  /live/vmlinuz boot=live components toram quiet splash
    initrd /live/initrd.img
}

# UEFI-only entry: Allows user to access hardware BIOS directly from bootloader
if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI Firmware Settings (Reboot to BIOS Setup)" --class efi {
        fwsetup
    }
fi

menuentry "Reboot System" --class reboot {
    reboot
}

menuentry "Power Off System" --class shutdown {
    halt
}
